<!-- ===== components/profile/profile.html ===== -->
<!doctype html>
<html lang="th">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
        />

        <title>Profile</title>

        <link rel="stylesheet" href="../../styles/reset.css" />
        <link rel="stylesheet" href="../../styles/variables.css" />
        <link rel="stylesheet" href="../../styles/global.css" />

        <link rel="stylesheet" href="profile.css" />
        <link rel="stylesheet" href="../shared/bottom-nav.css" />

        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        />
    </head>

    <body>
        <div class="profile-page-container">

            <div id="profile-main-view" class="profile-sub-view">
                <!-- ส่วนหัวสีน้ำเงินด้านบน -->
                <div class="profile-blue-banner">
                    <h2 class="profile-center-title">Profile</h2>
                    <div class="profile-avatar-circle-wrapper">
                        <img id="prof-avatar-view" src="../../assets/images/mycattt.jpg">
                    </div>
                    <h3 id="prof-name-view" class="profile-text-name">
                        กำลังโหลด...
                    </h3>
                    <p id="prof-email-view" class="profile-text-email">...</p>
                    <button
                        class="profile-pill-edit-btn"
                        onclick="toggleProfileMode('edit')"
                    >
                        แก้ไข
                    </button>
                </div>

                <!-- ส่วนเนื้อหาด้านล่างสีเทาอ่อน -->
                <div class="profile-content-body">
                    <!-- การ์ด Streak & Rank แบ่งครึ่งซ้ายขวา -->
                    <div class="profile-twin-stats-card">
                        <div class="stat-half-col border-right">
                            <span class="stat-huge-value"
                                >🔥 <span id="prof-streak-val">0</span></span
                            >
                            <span class="stat-small-label">Streak วัน</span>
                        </div>
                        <div class="stat-half-col">
                            <span class="stat-huge-value"
                                >#<span id="prof-rank-val">0</span></span
                            >
                            <span class="stat-small-label">อันดับ</span>
                        </div>
                    </div>

                    <!-- การ์ดแสดงระดับเลเวลและหลอด XP -->
                    <div class="profile-xp-progress-card">
                        <div class="xp-card-top-row">
                            <span class="xp-current-bold"
                                >⚡ <span id="prof-xp-val">0</span> XP</span
                            >
                            <span class="xp-target-muted"
                                ><span id="prof-xp-max">10000</span> XP</span
                            >
                        </div>
                        <div class="xp-custom-progress-bar">
                            <div
                                id="prof-xp-progress-fill"
                                class="xp-progress-fill"
                                style="width: 0%"
                            ></div>
                        </div>
                        <div class="xp-card-bottom-row">
                            <span class="level-lbl-left" id="prof-lvl-current"
                                >Level 6</span
                            >
                            <span class="level-lbl-right" id="prof-lvl-next"
                                >Level 7</span
                            >
                        </div>
                    </div>

                    <p class="profile-section-headline">การตั้งค่า</p>

                    <!-- รายการเมนูการตั้งค่า -->
                    <div class="profile-action-menu-list">
                        <div
                            class="profile-menu-row-item"
                            onclick="
                                alert('ระบบความปลอดภัยขั้นสูงกำลังเปิดใช้งาน')
                            "
                        >
                            <div class="menu-row-left-content">
                                <span class="menu-row-icon"
                                    ><i class="fa-solid fa-key"></i
                                ></span>
                                <span class="menu-row-text">ความปลอดภัย</span>
                            </div>
                        </div>
                        <div
                            class="profile-menu-row-item logout-theme"
                            onclick="handleLogoutAction()"
                        >
                            <div class="menu-row-left-content">
                                <span class="menu-row-icon"
                                    ><i class="fa-solid fa-door-open"></i
                                ></span>
                                <span class="menu-row-text">ออกจากระบบ</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="profile-edit-view" class="profile-sub-view hidden">
                <div class="profile-full-blue-container">
                    <h2 class="profile-center-title">Profile</h2>

                    <div class="profile-avatar-circle-wrapper edit-mode-avatar">
                        <img id="prof-avatar-edit" src="../../assets/images/mycattt.jpg">
                        <div class="avatar-pencil-overlay-badge">
                            <i class="fa-solid fa-pencil"></i>
                        </div>
                    </div>

                    <!-- ฟอร์มกรอกข้อมูลสไตล์แอปเกม -->
                    <div class="profile-edit-form-group">
                        <label class="profile-form-label">ชื่อ</label>
                        <input
                            type="text"
                            id="prof-input-name"
                            class="profile-round-input-field"
                            value=""
                        />
                    </div>

                    <div class="profile-edit-form-group">
                        <label class="profile-form-label">อีเมล</label>
                        <input
                            type="email"
                            id="prof-input-email"
                            class="profile-round-input-field"
                            value=""
                        />
                    </div>

                    <!-- ปุ่มบันทึกสีเขียวอ่อนตัวอักษรเขียวเข้ม -->
                    <button
                        class="profile-green-save-btn"
                        onclick="saveProfileChangesData()"
                    >
                        บันทึก
                    </button>
                </div>
            </div>

             <!-- Bottom Nav -->
            <div class="bottom-nav">

                <button class="nav-item" onclick="navigateTo('leaderboard')">
                    <i class="fas fa-trophy"></i>
                </button>

                <button class="nav-item" onclick="navigateTo('home')">
                    <i class="fas fa-home"></i>
                </button>

                <button class="nav-item active" onclick="navigateTo('profile')">
                    <i class="fas fa-user"></i>
                </button>

            </div>
        </div>

        <script src="../../core/navigation.js"></script>
        <script src="profile.js"></script>
    </body>
</html>
