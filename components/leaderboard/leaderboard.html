<!doctype html>
<html lang="th">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
        />

        <title>Daang Word Quest</title>

        <link rel="stylesheet" href="../../styles/reset.css" />
        <link rel="stylesheet" href="../../styles/variables.css" />
        <link rel="stylesheet" href="../../styles/global.css" />

        <link rel="stylesheet" href="leaderboard.css" />
        <link rel="stylesheet" href="../home/home.css" />
        <link rel="stylesheet" href="../shared/bottom-nav.css" />

        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        />
    </head>

    <body>
        <div class="leaderboard-page">
            <!-- 1. Header ส่วนบน (โลโก้ และสเตตัสหลอดพลัง) -->
            <header class="home-header page-header">
                <div class="logo-section">
                    <div class="logo-wrapper">
                        <img
                            src="../../assets/images/DaangLogo.png"
                            alt="DaangQuest">
                    </div>
                </div>

                <div class="user-stats">
                    <div class="stat fire">
                        🔥 1 วัน
                    </div>

                    <div class="stat xp">
                        ⚡ 1000 XP
                    </div>
                </div>
            </header>

            <!-- 2. ส่วนหัวข้อหลัก -->
            <section class="lb-title-section">
                <h1>Leaderboard 🏆</h1>
                <p>อันดับประจำสัปดาห์</p>
            </section>

            <!-- 3. การ์ดสรุปอันดับและคะแนนของตัวเอง (2 ฝั่งแยกสี) -->
            <section class="lb-summary-cards">
                <div class="lb-card rank-card">
                    <span class="lb-card-medal">🏅</span>
                    <span class="lb-card-text"
                        >อันดับของคุณ: <strong id="lb-my-rank">-</strong></span
                    >
                </div>

                <div class="lb-card xp-card">
                    <span class="lb-card-xp-value" id="lb-my-xp">0 XP</span>
                    <span class="lb-card-text sub-purple">คะแนนของคุณ</span>
                </div>
            </section>

            <!-- 4. รายการตารางอันดับกระดานคะแนน (รอโหลดข้อมูลจาก JS) -->
            <section class="lb-list-section">
                <div id="leaderboard-list-box" class="lb-list-box">
                    <!-- แถวรายชื่อจะถูกพ่นออกมาตรงนี้โดยอัตโนมัติ -->
                </div>
            </section>

            <!-- Bottom Nav -->
            <div class="bottom-nav">

                <button class="nav-item active" onclick="navigateTo('leaderboard')">
                    <i class="fas fa-trophy"></i>
                </button>

                <button class="nav-item" onclick="navigateTo('home')">
                    <i class="fas fa-home"></i>
                </button>

                <button class="nav-item" onclick="navigateTo('profile')">
                    <i class="fas fa-user"></i>
                </button>

            </div>
        </div>

        <script src="../../core/navigation.js"></script>
        <script type="module" src="leaderboard.js"></script>
    </body>
</html>
