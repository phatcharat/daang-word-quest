<!doctype html>
<html lang="th">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
        />

        <title>Daang Word Quest</title>

        <link rel="stylesheet" href="../../styles/reset.css" />
        <link rel="stylesheet" href="../../styles/variables.css" />
        <link rel="stylesheet" href="../../styles/global.css" />

        <link rel="stylesheet" href="leaderboard.css" />
        <link rel="stylesheet" href="../shared/bottom-nav.css" />

        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        />
    </head>

    <body>
        <div class="leaderboard-page">

            <!-- 1. ส่วนหัวข้อหลัก -->
            <section class="lb-title-section">
                <h1>Leaderboard 🏆</h1>
                <p>อันดับประจำสัปดาห์</p>
            </section>

            <!-- 2. การ์ดสรุปอันดับและคะแนนของตัวเอง (2 ฝั่งแยกสี) -->
            <section class="lb-summary-cards">
                <div class="lb-card rank-card">
                    <span class="lb-card-medal">🏅</span>
                    <span class="lb-card-text"
                        >อันดับของคุณ: <strong id="lb-my-rank">-</strong></span
                    >
                </div>

                <div class="lb-card xp-card">
                    <span class="lb-card-xp-value" id="lb-my-xp">0 XP</span>
                    <span class="lb-card-text sub-purple">คะแนนของคุณ</span>
                </div>
            </section>

            <!-- 3. รายการตารางอันดับกระดานคะแนน (Top 20) -->
            <section class="lb-list-section">
                <div id="leaderboard-list-box" class="lb-list-box">
                    <!-- แถวรายชื่อจะถูกพ่นออกมาตรงนี้โดยอัตโนมัติ -->
                </div>
            </section>

            <!-- 4. แถบลอยแสดงอันดับผู้เล่นเอง (โชว์เฉพาะตอนอันดับหลุด Top 20) -->
            <div id="lb-sticky-user" class="lb-sticky-user hidden">
                <span class="lb-sticky-rank" id="lb-sticky-rank">#-</span>
                <span class="lb-sticky-name" id="lb-sticky-name">คุณ</span>
                <span class="lb-sticky-xp" id="lb-sticky-xp">0 XP</span>
            </div>

            <!-- Bottom Nav -->
            <div class="bottom-nav">

                <button class="nav-item active" onclick="navigateTo('leaderboard')">
                    <i class="fas fa-trophy"></i>
                </button>

                <button class="nav-item" onclick="navigateTo('home')">
                    <i class="fas fa-home"></i>
                </button>

                <button class="nav-item" onclick="navigateTo('profile')">
                    <i class="fas fa-user"></i>
                </button>

            </div>
        </div>

        <script src="../../core/navigation.js"></script>
        <script type="module" src="leaderboard.js"></script>
    </body>
</html>
