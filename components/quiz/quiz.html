<!doctype html>
<html lang="th">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
        />
        <title>Quiz 4 ตัวเลือก</title>

        <link rel="stylesheet" href="../../styles/reset.css" />
        <link rel="stylesheet" href="../../styles/variables.css" />
        <link rel="stylesheet" href="../../styles/global.css" />

        <link rel="stylesheet" href="../game/game.css" />
        <link rel="stylesheet" href="quiz.css" />
        <link rel="stylesheet" href="../shared/bottom-nav.css" />

        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        />
    </head>

    <body>
        <div class="game-page">
            <header class="game-header">
                <div class="header-left">
                    <span class="mode-icon"
                        ><i class="fa-solid fa-list-check"></i
                    ></span>
                    <span class="mode-title">Quiz 4 ตัวเลือก</span>
                </div>
                <div class="header-right">
                    <span class="stat-badge xp-badge" id="header-xp-badge"
                        >⚡ 0 XP</span
                    >
                </div>
            </header>

            <div class="game-loading" id="game-loading">
                <i class="fa-solid fa-spinner fa-spin"></i>
                <p id="game-loading-text">กำลังโหลดบทเรียน...</p>
            </div>

            <div class="quiz-content hidden" id="quiz-content">
                <div class="progress-container">
                    <div class="progress-bar-wrapper">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                    <span class="progress-text" id="progress-text"></span>
                </div>

                <div class="word-card-new-theme">
                    <div class="card-content-wrapper">
                        <div class="image-placeholder" id="quiz-image-placeholder"></div>
                        <div class="quiz-word-display hidden" id="quiz-word-display"></div>
                    </div>
                </div>

                <div class="choice-grid" id="choice-grid"></div>
            </div>

            <div class="feedback-banner success hidden" id="feedback-success">
                <div class="feedback-content">
                    <h3><i class="fa-solid fa-circle-check"></i> ถูกต้อง! +10 XP</h3>
                    <p></p>
                </div>
                <button class="btn-next">
                    คำต่อไป <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>

            <div class="feedback-banner error hidden" id="feedback-error">
                <div class="feedback-content">
                    <h3><i class="fa-solid fa-circle-xmark"></i> ไม่ถูกต้อง!</h3>
                    <p></p>
                </div>
                <button class="btn-next error-btn">
                    ต่อไป <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>

        <script src="../../core/quiz-manager.js"></script>
        <script type="module" src="quiz.js"></script>
    </body>
</html>
